<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t"><title id="t">Tahap 2: Rekeningo dipakai di tiga kompleks. Budi menarik Rp70.000 dari HP dan Rp50.000 dari tablet hampir bersamaan, keduanya sukses padahal saldonya Rp100.000. Sinyal kantin lemah.</title><rect width="720" height="400" fill="#FFFFFF"/><rect x="0" y="330" width="720" height="70" fill="#F3F4F7"/><rect x="20" y="130" width="62" height="200" rx="5" fill="#E4F0FF" stroke="#0075EB" stroke-width="2"/><rect x="95" y="105" width="62" height="225" rx="5" fill="#E4F0FF" stroke="#0075EB" stroke-width="2"/><rect x="170" y="80" width="62" height="250" rx="5" fill="#E4F0FF" stroke="#0075EB" stroke-width="2"/><text x="125" y="62" font-family="Figtree, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#0075EB" text-anchor="middle">Tiga kompleks</text><g transform="translate(268,50)"><rect width="130" height="180" rx="16" fill="#051027"/><rect x="7" y="9" width="116" height="162" rx="11" fill="#FFFFFF"/><rect x="14" y="20" width="102" height="44" rx="8" fill="#0075EB"/><text x="65.0" y="48" font-family="Figtree, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="middle">Tarik</text><text x="65.0" y="78" font-family="Figtree, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">Rp70.000</text><text x="65.0" y="106" font-family="Figtree, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="800" fill="#0F766E" text-anchor="middle">sukses</text></g><g transform="translate(520,50)"><rect width="150" height="180" rx="16" fill="#051027"/><rect x="7" y="9" width="136" height="162" rx="11" fill="#FFFFFF"/><rect x="14" y="20" width="122" height="44" rx="8" fill="#0075EB"/><text x="75.0" y="48" font-family="Figtree, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="middle">Tarik</text><text x="75.0" y="78" font-family="Figtree, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">Rp50.000</text><text x="75.0" y="106" font-family="Figtree, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="800" fill="#0F766E" text-anchor="middle">sukses</text></g><text x="333" y="255" font-family="Figtree, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="600" fill="#6B7280" text-anchor="middle">HP</text><text x="595" y="255" font-family="Figtree, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="600" fill="#6B7280" text-anchor="middle">tablet</text><path d="M400 140 L432 230 M520 140 L476 230" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 5" fill="none"/><g transform="translate(455,330) scale(0.9)"><rect x="-30" y="-100" width="60" height="78" rx="24" fill="#0F766E"/><rect x="-22" y="-26" width="18" height="26" rx="6" fill="#051027"/><rect x="4" y="-26" width="18" height="26" rx="6" fill="#051027"/><circle cx="0" cy="-124" r="24" fill="#E0A980"/><path d="M-25 -126 a25 25 0 0 1 50 0 a40 22 0 0 0 -50 0z" fill="#3F2A1D"/></g><text x="455" y="355" font-family="Figtree, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="600" fill="#6B7280" text-anchor="middle">Budi</text><rect x="640" y="310" width="10" height="10" rx="2" fill="#D26B00"/><rect x="656" y="300" width="10" height="20" rx="2" fill="#D1D5DB"/><rect x="672" y="290" width="10" height="30" rx="2" fill="#D1D5DB"/><rect x="688" y="280" width="10" height="40" rx="2" fill="#D1D5DB"/><text x="670" y="355" font-family="Figtree, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="600" fill="#6B7280" text-anchor="middle">sinyal</text><text x="360.0" y="388" font-family="Figtree, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="600" fill="#1F2937" text-anchor="middle">Saldo Rp100.000. Dua penarikan bersamaan, keduanya sukses.</text></svg>
