openapi: 3.1.0
info:
  title: Rekeningo API (fiktif)
  version: 1.5.0
  description: Kontrak API Tahap 1. Lab, bukan layanan sungguhan.
servers:
  - url: http://127.0.0.1:18081
security:
  - bearer: []
paths:
  /transfers:
    post:
      operationId: buatTransfer
      summary: Kirim saldo ke akun lain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermintaanTransfer'
      responses:
        '201':
          description: Transfer dibuat
          headers:
            Location:
              description: Alamat transfer yang baru dibuat
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HasilTransfer'
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /akun/{id}:
    get:
      operationId: lihatAkun
      summary: Lihat akun milik sendiri
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Data akun
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Akun'
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Problem:
      description: Error RFC 9457
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    PermintaanTransfer:
      type: object
      required: [ke, jumlah]
      properties:
        ke: { type: string, description: ID akun penerima }
        jumlah: { type: integer, format: int64, minimum: 1, maximum: 5000000, description: Rupiah }
    HasilTransfer:
      type: object
      required: [id, saldo]
      properties:
        id: { type: integer, format: int64 }
        saldo: { type: integer, format: int64, description: Saldo pengirim sesudah transfer }
    Akun:
      type: object
      required: [id, nama, balance]
      properties:
        id: { type: string }
        nama: { type: string }
        balance: { type: integer, format: int64 }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              pesan: { type: string }
        saldo: { type: integer, format: int64 }
