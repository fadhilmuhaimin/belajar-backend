site_name: Belajar Backend
site_description: Konsep backend lintas stack untuk mobile engineer, lewat satu cerita aplikasi fiktif yang tumbuh
docs_dir: docs
strict: true

theme:
  name: material
  language: id
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

hooks:
  - tools/mkdocs_hooks.py

extra_css:
  - stylesheets/extra.css
  - widgets/widgets.css

extra_javascript:
  - javascripts/istilah-data.js
  - javascripts/istilah.js
  - widgets/core.js
  - widgets/runsql-core.js
  - widgets/runsql.js
  - widgets/race.js
  - widgets/cerita.js
  - widgets/stackstep.js
  - widgets/hp.js
  - widgets/alur-core.js
  - widgets/alur.js
  - widgets/pilah.js
  - widgets/banding.js
  - widgets/kartu.js
  - widgets/ember.js

markdown_extensions:
  - abbr
  - pymdownx.snippets:
      auto_append:
        - includes/istilah.md
      check_paths: true
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.fancylists
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

validation:
  links:
    anchors: warn

