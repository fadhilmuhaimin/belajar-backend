# Fase 0 (plan/PROPOSAL.md, "Rencana migrasi"): gerbang kualitas yang sama dengan laptop,
# dijalankan di setiap PR dan setiap push ke main. Isinya persis `tools/cek_batch.sh`;
# yang disiapkan di sini hanya lingkungannya (Python 3.14, Node 22, Chrome, font).
# Versi action dicek ke halaman rilis masing-masing pada 2026-10-08 (keputusan 99).
name: cek

on:
  pull_request:
  push:
    branches: [main, 'percobaan/**']   # branch percobaan ikut dicek tanpa membuka PR
  workflow_dispatch:

concurrency:
  group: cek-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cek_batch:
    name: cek_batch.sh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # cek_layar_pertama.mjs mencari Chrome lewat CHROME_PATH (tools/lib/chrome.mjs).
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable

      # cek_batch.sh memanggil .venv/bin/python dan .venv/bin/mkdocs, sama seperti di laptop.
      - name: Siapkan .venv
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt

      # Ubuntu 24.04 (ubuntu-latest) membatasi user namespace tanpa hak akses lewat AppArmor, dan sandbox
      # Chrome membutuhkannya; tanpa ini Chrome berhenti sebelum menulis DevToolsActivePort.
      # Sumber: https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
      # Runner CI sekali pakai, jadi melonggarkan ini di runner lebih baik daripada --no-sandbox di kode alat.
      - name: Izinkan sandbox Chrome di Ubuntu 24.04
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Font asli wajib: dengan font fallback, teks lebih tinggi dan layar 375x667 bisa gagal (README).
      # Satoshi diunduh dari Fontshare saat build (self-host), tidak disimpan di repo (lisensi FFL).
      - name: Unduh font
        run: bash tools/get_fonts.sh

      - name: Jalankan gerbang kualitas
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: bash tools/cek_batch.sh

  pesan_commit:
    name: pesan commit
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # butuh seluruh commit PR, bukan hanya HEAD
      # CLAUDE.md "commit": tanpa trailer Co-Authored-By dan tanpa tanda alat AI (keputusan 110).
      # "Claude" dicari peka huruf besar supaya nama file CLAUDE.md di pesan tetap boleh.
      - name: Tolak trailer dan tanda AI di pesan commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          gagal=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            pesan=$(git log -1 --format=%B "$sha")
            if printf '%s' "$pesan" | grep -qiE 'co-authored-by' || printf '%s' "$pesan" | grep -qE 'Claude'; then
              echo "::error::Pesan commit $sha mengandung Co-Authored-By atau Claude"
              printf '%s\n' "$pesan"
              gagal=1
            fi
          done
          exit $gagal

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # memindai seluruh riwayat, bukan hanya commit terakhir
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  situs_baru:
    name: situs (Astro)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: situs/package-lock.json
      - name: Unduh font
        run: bash tools/get_fonts.sh
      - name: Pasang dependency
        run: npm --prefix situs ci
      - name: Pasang Chromium Playwright
        run: cd situs && npx playwright install --with-deps chromium
      # Satu skrip untuk laptop dan CI: registry, istilah, audit bahasa, build strict, ID internal,
      # kontras dua mode, tes, layar pertama 4 ukuran, tangkapan 2 ukuran x 2 mode (keputusan 111).
      - name: Gerbang kualitas situs
        run: bash tools/cek_situs.sh --layar
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tangkapan-situs
          path: situs/tangkapan/*.png
          retention-days: 7
